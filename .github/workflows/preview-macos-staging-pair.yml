name: preview-macos-staging-pair
on:
  push:
    branches: [ci/preview-mac-staging]
permissions:
  contents: read
concurrency:
  group: preview-macos-staging-pair
  cancel-in-progress: true
jobs:
  cancel-only:
    if: github.repository == 'flowforever/GitDesktop' && github.ref == 'refs/heads/ci/preview-mac-staging'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Publication canceled'
