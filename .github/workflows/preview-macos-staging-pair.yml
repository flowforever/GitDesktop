name: preview-macos-staging-pair

# Temporary branch-only workflow. Never run from PRs or on the release branch.
on:
  push:
    branches: [ci/preview-mac-staging]

permissions:
  contents: read

concurrency:
  group: preview-macos-staging-pair
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'flowforever/GitDesktop' && github.ref == 'refs/heads/ci/preview-mac-staging'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: bash .github/scripts/build-preview-macos-staging.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: disposable-macos-staging-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gd-mac-stage-assets/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: >-
      github.repository == 'flowforever/GitDesktop' &&
      github.ref == 'refs/heads/ci/preview-mac-staging' &&
      startsWith(github.event.head_commit.message, 'Publish disposable macOS preview test')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: disposable-macos-staging-${{ github.run_attempt }}
          path: pair
      - run: node .github/scripts/preview-macos-staging-release.mjs verify pair
      - run: node .github/scripts/preview-macos-staging-release.mjs publish pair
        env:
          GH_TOKEN: ${{ github.token }}
