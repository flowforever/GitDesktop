name: signed-preview

on:
  push:
    branches: [master, ci/preview-staging]
  workflow_dispatch:

# Do not add a pull_request or pull_request_target trigger to this workflow.
permissions:
  contents: read

concurrency:
  group: signed-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    if: >-
      github.repository == 'flowforever/GitDesktop' &&
      ((github.ref == 'refs/heads/master' && vars.GITDESKTOP_PREVIEW_PRODUCTION_ENABLED == 'true') ||
       (github.ref == 'refs/heads/ci/preview-staging' && vars.GITDESKTOP_PREVIEW_STAGING_ENABLED == 'true'))
    environment: ${{ github.ref == 'refs/heads/master' && 'preview-release' || 'preview-staging' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: appimage
            slot: linux
          - os: windows-2025
            bundle: nsis
            slot: windows
          - os: macos-26
            bundle: dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            slot: macos
    env:
      GITDESKTOP_PREVIEW_SIGNING_CHANNEL: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}
      GITDESKTOP_PREVIEW_UPDATER_PUBKEY: ${{ vars.GITDESKTOP_PREVIEW_UPDATER_PUBKEY }}
      GITDESKTOP_PREVIEW_STAGING_ENDPOINT: ${{ vars.GITDESKTOP_PREVIEW_STAGING_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"
          save-if: false
      - name: Verify enabled signing inputs
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing preview signing key'; exit 1; }
          node .github/scripts/preview-config.mjs
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev file
      - uses: ./.github/actions/pin-linuxdeploy
        if: runner.os == 'Linux'
      - run: pnpm install --frozen-lockfile
      - name: Build and sign preview without publishing
        shell: bash
        env:
          VITE_GITDESKTOP_PREVIEW_UPDATES: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundle }} ${{ matrix.args }} --config "$RUNNER_TEMP/gitdesktop-preview.json"
      - name: Check Linux package
        if: runner.os == 'Linux'
        run: bash .github/scripts/appimage-guard.sh
      - name: Verify and version-sign the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          images=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          version=$(node -p 'require(process.env.RUNNER_TEMP + "/gitdesktop-preview-build.json").version')
          hdiutil verify "${images[0]}"
          pnpm tauri signer sign --app-version "$version" "${images[0]}"
      - name: Normalize signed files for validation
        run: node .github/scripts/preview-release.mjs collect ${{ matrix.slot }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-signed-${{ github.run_attempt }}-${{ matrix.slot }}
          path: ${{ runner.temp }}/preview-upload/
          if-no-files-found: error
          retention-days: 7

  verify-staging:
    needs: bundle
    if: >-
      github.repository == 'flowforever/GitDesktop' &&
      github.ref == 'refs/heads/ci/preview-staging' &&
      vars.GITDESKTOP_PREVIEW_STAGING_ENABLED == 'true'
    environment: preview-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITDESKTOP_PREVIEW_UPDATER_PUBKEY: ${{ vars.GITDESKTOP_PREVIEW_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: preview-signed-${{ github.run_attempt }}-*
          path: signed-parts
      - name: Validate all disposable staging signatures
        run: node .github/scripts/preview-release.mjs validate signed-parts staging-assets staging

  publish:
    needs: bundle
    if: >-
      github.repository == 'flowforever/GitDesktop' &&
      github.ref == 'refs/heads/master' &&
      vars.GITDESKTOP_PREVIEW_PRODUCTION_ENABLED == 'true'
    environment: preview-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GITDESKTOP_PREVIEW_UPDATER_PUBKEY: ${{ vars.GITDESKTOP_PREVIEW_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: preview-signed-${{ github.run_attempt }}-*
          path: signed-parts
      - name: Validate staged packages and version-bound signatures
        run: node .github/scripts/preview-release.mjs validate signed-parts release-assets
      - name: Publish immutable version and promote feed metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/preview-release.mjs publish release-assets
